<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NARA — Activities</title>

<style>

/* =========================
   BASIC
   ========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #ffffff;
    color: #171717;
    font-family: Georgia, "Times New Roman", serif;
}


/* =========================
   HEADER / BANNER
   ========================= */

.activities-header {
    width: 100%;
    max-width: 980px;
    height: 170px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 0 0 24px 24px;
}

.activities-header img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
}


/* =========================
   MAIN PAGE
   ========================= */

.activities-page {
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    padding: 18px 28px 50px;
}


/* =========================
   BACK TO NARA
   ========================= */

.back-nara {
    display: inline-block;

    color: #222;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;

    text-decoration: none;

    border-bottom: 2px solid #ffd400;

    padding-bottom: 3px;
    margin-bottom: 12px;
}

.back-nara:hover {
    color: #c49d00;
}


/* =========================
   TITLE
   ========================= */

.activities-title {
    margin: 0;

    text-align: center;

    font-size: 44px;
    line-height: 1.05;
}

.activities-intro {
    max-width: 650px;

    margin: 12px auto 28px;

    text-align: center;

    color: #777;

    font-size: 17px;
    line-height: 1.45;
}


/* =========================
   PHOTO GRID
   ========================= */

.photo-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 16px;

    max-width: 850px;

    margin: 0 auto;
}


/* =========================
   PHOTO CARD
   ========================= */

.photo-card {

    width: 100%;

    aspect-ratio: 4 / 3;

    overflow: hidden;

    background: #eeeeee;

    border-radius: 5px;

    cursor: zoom-in;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.10);
}

.photo-card img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    transition:
        transform 0.25s ease;
}

.photo-card:hover img {

    transform:
        scale(1.035);
}


/* =========================
   ZOOM / LIGHTBOX
   ========================= */

.lightbox {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 50px 70px;

    background:
        rgba(0,0,0,0.88);

    z-index: 9999;
}

.lightbox.show {
    display: flex;
}


/* BIG PHOTO */

.zoom-image {

    max-width: 88vw;

    max-height: 88vh;

    width: auto;
    height: auto;

    object-fit: contain;

    border-radius: 6px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.45);
}


/* =========================
   CLOSE BUTTON
   ========================= */

.close-btn {

    position: fixed;

    top: 18px;
    right: 24px;

    width: 42px;
    height: 42px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.90);

    color: #111;

    font-size: 30px;

    line-height: 40px;

    cursor: pointer;

    z-index: 10001;
}


/* =========================
   PREVIOUS / NEXT
   ========================= */

.nav-btn {

    position: fixed;

    top: 50%;

    transform:
        translateY(-50%);

    width: 48px;
    height: 48px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.18);

    color: #ffffff;

    font-size: 34px;

    line-height: 44px;

    cursor: pointer;

    z-index: 10000;
}

.nav-btn:hover {

    background:
        rgba(255,255,255,0.32);
}

.prev-btn {
    left: 22px;
}

.next-btn {
    right: 22px;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 700px) {

    .activities-header {

        height: 118px;

        border-radius:
            0 0 18px 18px;
    }


    .activities-page {

        padding:
            14px 14px 40px;
    }


    .back-nara {

        font-size: 12px;

        margin-bottom: 10px;
    }


    .activities-title {

        font-size: 36px;
    }


    .activities-intro {

        font-size: 15px;

        margin-bottom: 22px;
    }


    .photo-grid {

        grid-template-columns:
            repeat(3, 1fr);

        gap: 9px;
    }


    .photo-card {

        border-radius: 3px;
    }


    .lightbox {

        padding:
            35px 18px;
    }


    .zoom-image {

        max-width: 94vw;

        max-height: 82vh;
    }


    .close-btn {

        top: 10px;
        right: 12px;

        width: 38px;
        height: 38px;

        font-size: 27px;

        line-height: 36px;
    }


    .nav-btn {

        width: 42px;
        height: 42px;

        font-size: 29px;

        line-height: 38px;
    }


    .prev-btn {
        left: 7px;
    }

    .next-btn {
        right: 7px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
     GANTI Act.dewii9.jpg DENGAN FOTO HEADER BARU NANTI
     ===================================================== -->

<header class="activities-header">

    <img
        src="Act.dewii9.jpg"
        alt="NARA"
    >

</header>



<main class="activities-page">


    <!-- =========================
         BACK TO NARA
         ========================= -->

    <a
        href="index.html"
        class="back-nara">

        ← BACK TO NARA

    </a>



    <!-- =========================
         TITLE
         ========================= -->

    <h1 class="activities-title">

        Activities

    </h1>


    <p class="activities-intro">

        Real moments. Happy faces. A brighter tomorrow.<br>

        Here are some of the activities and programs
        we've been part of.

    </p>



    <!-- =====================================================
         PHOTO GALLERY
         ===================================================== -->

    <section class="photo-grid">


        <!-- PHOTO 1 -->

        <div
            class="photo-card"
            onclick="openLightbox(0)">

            <img
                src="Act1.jpg"
                alt="NARA Activity 1">

        </div>



        <!-- PHOTO 2 -->

        <div
            class="photo-card"
            onclick="openLightbox(1)">

            <img
                src="Act2.jpg"
                alt="NARA Activity 2">

        </div>



        <!-- PHOTO 3 -->

        <div
            class="photo-card"
            onclick="openLightbox(2)">

            <img
                src="Act3.jpg"
                alt="NARA Activity 3">

        </div>



        <!-- PHOTO 4 -->

        <div
            class="photo-card"
            onclick="openLightbox(3)">

            <img
                src="Act4.jpg"
                alt="NARA Activity 4">

        </div>



        <!-- PHOTO 5 -->

        <div
            class="photo-card"
            onclick="openLightbox(4)">

            <img
                src="Act5.jpg"
                alt="NARA Activity 5">

        </div>



        <!-- PHOTO 6 -->

        <div
            class="photo-card"
            onclick="openLightbox(5)">

            <img
                src="Act6.jpg"
                alt="NARA Activity 6">

        </div>


    </section>



</main>



<!-- =====================================================
     ZOOM LIGHTBOX
     ===================================================== -->

<div
    class="lightbox"
    id="lightbox"
    onclick="backgroundClose(event)">


    <!-- CLOSE -->

    <button
        class="close-btn"
        onclick="closeLightbox()">

        ×

    </button>



    <!-- PREVIOUS -->

    <button
        class="nav-btn prev-btn"
        onclick="
            changePhoto(-1);
            event.stopPropagation();
        ">

        ‹

    </button>



    <!-- LARGE PHOTO -->

    <img
        id="zoomImage"
        class="zoom-image"
        src=""
        alt="NARA Activity"
        onclick="event.stopPropagation();"
    >



    <!-- NEXT -->

    <button
        class="nav-btn next-btn"
        onclick="
            changePhoto(1);
            event.stopPropagation();
        ">

        ›

    </button>


</div>



<script>

/* =====================================================
   PHOTO LIST

   NANTI CUKUP GANTI NAMA FILE DI SINI
   ===================================================== */

const activityPhotos = [

    "Act1.jpg",

    "Act2.jpg",

    "Act3.jpg",

    "Act4.jpg",

    "Act5.jpg",

    "Act6.jpg"

];


let currentPhoto = 0;



/* =====================================================
   OPEN ZOOM
   ===================================================== */

function openLightbox(index) {

    currentPhoto = index;

    document.getElementById("zoomImage").src =
        activityPhotos[currentPhoto];

    document
        .getElementById("lightbox")
        .classList.add("show");

    document.body.style.overflow =
        "hidden";
}



/* =====================================================
   CLOSE ZOOM
   ===================================================== */

function closeLightbox() {

    document
        .getElementById("lightbox")
        .classList.remove("show");

    document.body.style.overflow =
        "";
}



/* =====================================================
   NEXT / PREVIOUS
   ===================================================== */

function changePhoto(direction) {

    currentPhoto += direction;


    if (currentPhoto < 0) {

        currentPhoto =
            activityPhotos.length - 1;
    }


    if (
        currentPhoto >=
        activityPhotos.length
    ) {

        currentPhoto = 0;
    }


    document.getElementById("zoomImage").src =
        activityPhotos[currentPhoto];
}



/* =====================================================
   CLICK OUTSIDE PHOTO = CLOSE
   ===================================================== */

function backgroundClose(event) {

    if (
        event.target.id ===
        "lightbox"
    ) {

        closeLightbox();
    }
}



/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        const lightbox =
            document.getElementById(
                "lightbox"
            );


        if (
            !lightbox.classList.contains(
                "show"
            )
        ) {

            return;
        }


        if (
            event.key === "Escape"
        ) {

            closeLightbox();
        }


        if (
            event.key === "ArrowLeft"
        ) {

            changePhoto(-1);
        }


        if (
            event.key === "ArrowRight"
        ) {

            changePhoto(1);
        }

    }
);

</script>


</body>
</html>
