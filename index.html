/* =========================================================
   DETECT BROWSER LANGUAGE
   ========================================================= */

function detectNaraLanguage() {

    const browserLanguages =
        navigator.languages ||
        [navigator.language || "en"];

    for (const language of browserLanguages) {

        const code =
            language
                .toLowerCase()
                .split("-")[0];

        if (naraTranslations[code]) {
            return code;
        }
    }

    return "en";
}


/* =========================================================
   GET CURRENT TRANSLATION
   ========================================================= */

function naraText(key) {

    const language =
        window.naraLanguage || "en";

    return (
        naraTranslations[language]?.[key] ||
        naraTranslations.en[key] ||
        ""
    );
}


/* =========================================================
   APPLY LANGUAGE
   ========================================================= */

function applyNaraLanguage() {

    const language =
        detectNaraLanguage();

    const translations =
        naraTranslations[language] ||
        naraTranslations.en;

    window.naraLanguage = language;

    document.documentElement.lang =
        language;

    document.documentElement.dir =
        language === "ar"
            ? "rtl"
            : "ltr";

    document.title =
        translations.pageTitle;

    document
        .querySelectorAll("[data-i18n]")
        .forEach(function(element) {

            const key =
                element.getAttribute("data-i18n");

            if (translations[key]) {

                element.textContent =
                    translations[key];

            }

        });

}

/* =========================================================
   COPY FUNCTION
   Works with Android / modern browsers
   ========================================================= */

function copyText(text, successMessage, errorMessage, messageElement) {

    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        navigator.clipboard
            .writeText(text)
            .then(function() {

                messageElement.innerText =
                    successMessage;

            })
            .catch(function() {

                fallbackCopy(
                    text,
                    successMessage,
                    errorMessage,
                    messageElement
                );

            });

    } else {

        fallbackCopy(
            text,
            successMessage,
            errorMessage,
            messageElement
        );

    }
}


/* =========================================================
   FALLBACK COPY
   ========================================================= */

function fallbackCopy(
    text,
    successMessage,
    errorMessage,
    messageElement
) {

    const textarea =
        document.createElement("textarea");

    textarea.value =
        text;

    textarea.style.position =
        "fixed";

    textarea.style.left =
        "-9999px";

    textarea.style.top =
        "0";

    document.body.appendChild(
        textarea
    );

    textarea.focus();

    textarea.select();

    try {

        const successful =
            document.execCommand("copy");

        if (successful) {

            messageElement.innerText =
                successMessage;

        } else {

            messageElement.innerText =
                errorMessage;

        }

    } catch (error) {

        messageElement.innerText =
            errorMessage;

    }

    document.body.removeChild(
        textarea
    );
}

   COPY BITCOIN
   ========================================================= */

function copyBitcoinAddress() {

    const addressElement =
        document.getElementById(
            "bitcoinAddress"
        );

    const messageElement =
        document.getElementById(
            "copyMessage"
        );

    if (
        !addressElement ||
        !messageElement
    ) {
        return;
    }

    const address =
        addressElement.innerText.trim();

    copyText(
        address,
        naraText("bitcoinCopied"),
        naraText("unableCopy"),
        messageElement
    );
}

function copyUsdtTrc20() {

    const addressElement =
        document.getElementById(
            "usdtTrc20Address"
        );

    const messageElement =
        document.getElementById(
            "usdtTrc20Message"
        );

    if (
        !addressElement ||
        !messageElement
    ) {
        return;
    }

    const address =
        addressElement.innerText.trim();

    copyText(
        address,
        naraText("usdtTrcCopied"),
        naraText("unableCopy"),
        messageElement
    );
}
