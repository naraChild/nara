  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    /* LANDING */
    #naraLanding {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    .landing-inner {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    .landing-logo {
      width: min(220px, 55vw);
      height: auto;
      margin-bottom: 20px;
    }

    .landing-inner h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 7vw, 56px);
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .landing-inner h2 {
      margin: 0 0 25px;
      font-size: clamp(18px, 4vw, 28px);
      font-weight: normal;
    }

    .landing-inner p {
      max-width: 650px;
      margin: 0 auto 25px;
      color: #555;
    }

    .landing-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 430px;
      margin: 0 auto 15px;
    }

    .landing-form input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .landing-form input:focus {
      outline: none;
      border-color: #111;
    }

    .landing-form button {
      border: 0;
      border-radius: 8px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
    }

    .landing-form button:disabled {
      background: #d8d8d8;
      color: #888;
      cursor: not-allowed;
    }

    .landing-form button:not(:disabled) {
      background: #111;
      color: #fff;
      cursor: pointer;
    }

    .landing-message {
      min-height: 20px;
      margin: 2px 0 0 !important;
      font-size: 13px;
      color: #666;
    }

    /* MAIN */
    #naraMain {
      display: none;
    }

    header {
      width: 100%;
      background: #111;
      text-align: center;
    }

    header img {
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      display: block;
    }

    /* NAVIGATION */
    .site-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
      padding: 10px;
      background: rgba(17, 17, 17, 0.97);
      border-bottom: 1px solid #333;
    }

    .site-nav a {
      text-decoration: none;
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    .site-nav a:hover {
      background: #333;
    }

    main {
      max-width: 1180px;
      margin: auto;
      padding: 30px 18px 50px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 30px;
      align-items: start;
    }

    section {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 25px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.06);
    }

    section h2 {
      margin-top: 0;
      font-size: 28px;
      line-height: 1.2;
    }

    section h3 {
      font-size: 21px;
    }

    .intro-text {
      font-size: 18px;
    }

    /* CHILDREN */
    .children-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 20px;
    }

    .children-grid img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    /* SIDEBAR */
    aside {
      position: sticky;
      top: 75px;
    }

    .side-card {
      background: #fff;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.06);
    }

    .side-card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .explore-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .explore-list li {
      border-bottom: 1px solid #eee;
    }

    .explore-list li:last-child {
      border-bottom: 0;
    }

    .explore-list a {
      display: block;
      padding: 12px 4px;
      text-decoration: none;
      font-weight: bold;
    }

    .explore-list a:hover {
      text-decoration: underline;
    }

    .opportunity-card {
      background: #111;
      color: #fff;
    }

    .opportunity-card a {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 14px;
      border-radius: 6px;
      background: #fff;
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }

    /* AI TOOLS */
    .ai-tools-card {
      background: #fff;
      color: #222;
    }

    .ai-tools-card a {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 14px;
      border-radius: 6px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    .ai-tools-card a:hover {
      background: #333;
    }

    /* READ MORE */
    .read-more {
      display: inline-block;
      margin-top: 10px;
      font-weight: bold;
      text-decoration: none;
    }

    .full-text {
      display: none;
      margin-top: 18px;
    }

    /* DONATION */
    #donation {
      scroll-margin-top: 80px;
    }

    .donation-intro {
      color: #555;
    }

    .donation-box {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 18px;
      margin: 16px 0;
      background: #fafafa;
    }

    .donation-label {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 9px;
      letter-spacing: 0.5px;
    }

    .donation-address {
      padding: 12px;
      border-radius: 7px;
      background: #fff;
      border: 1px solid #ddd;
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
      margin-bottom: 10px;
    }

    .copy-button {
      border: 0;
      background: #111;
      color: #fff;
      padding: 9px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .copy-button:hover {
      opacity: 0.85;
    }

    .donation-note {
      font-size: 14px;
      color: #666;
      margin-top: 18px;
    }

    /* WARNING / DISCLAIMER */
    .warning {
      background: #fff8e1;
      border-left: 5px solid #e0a800;
      padding: 16px 18px;
      margin: 25px 0;
      border-radius: 6px;
    }

    .disclaimer {
      font-size: 13px;
      color: #666;
      padding: 0 5px;
    }

    footer {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 28px 18px;
      margin-top: 20px;
    }

    footer p {
      margin: 5px 0;
    }

    /* MOBILE */
    @media (max-width: 850px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      aside {
        position: static;
      }

      .children-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .site-nav {
        justify-content: flex-start;
        overflow-x: auto;
        flex-wrap: nowrap;
      }

      .site-nav a {
        font-size: 13px;
        padding: 9px 11px;
      }

      main {
        padding: 20px 12px 40px;
      }

      section {
        padding: 20px;
      }

      section h2 {
        font-size: 24px;
      }

      .children-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 9px;
      }

      .donation-address {
        font-size: 12px;
      }
    }
  </style>
</head>

      <img

        class="landing-logo"
      >
