    .landing-inner h1 {

      padding: 14px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .landing-form button,
    .skip-button {
      border: 0;
      border-radius: 8px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .landing-form button {
      background: #111;
      color: #fff;
    }

    .skip-button {
      background: transparent;
      color: #555;

    }

    header {
      width: 100%;
      background: #111;
      text-align: center;
    }

    header img {
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      display: block;
    }

    .site-nav {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(17, 17, 17, 0.97);
      border-bottom: 1px solid #333;
    }

    .site-nav a {

      color: #fff;
      padding: 10px 14px;

      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    .site-nav a:hover {
      background: #333;
    }

    }

      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 30px;
      align-items: start;
    }

      border-radius: 12px;
      padding: 28px;
      margin-bottom: 25px;

    }

    section h2 {
      margin-top: 0;
      font-size: 28px;
      line-height: 1.2;
    }

    section h3 {
      font-size: 21px;
    }

    .intro-text {
      font-size: 18px;
    }

      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 20px;
    }

      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }
