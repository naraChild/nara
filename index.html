    /* =========================
       LANDING
    ========================= */

    #naraLanding {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      text-align: center;
    }

    .landing-box {
      width: 100%;
      max-width: 500px;
    }

    .landing-logo {
      width: 120px;

      margin: 0 auto 25px;
    }

    .landing-title {
      font-size: clamp(38px, 8vw, 72px);
      line-height: .95;

      margin-bottom: 30px;
    }

    .landing-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .landing-form input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .landing-form input:focus {
      border-color: #111;
    }

    .landing-form button {
      border: 0;
      border-radius: 8px;
      padding: 15px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .landing-form button:hover {
      opacity: .85;
    }

    .skip-link {
      display: inline-block;
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }

    .skip-link:hover {
      color: #000;
    }

    /* =========================
       MAIN
    ========================= */

    #naraMain {
      display: none;
    }

    header {
      width: 100%;
      background: #fff;
    }

    .header-image {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .site-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid #ddd;
      backdrop-filter: blur(10px);
    }

    .nav-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 15px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .nav-inner::-webkit-scrollbar {
      display: none;
    }

    .nav-link {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 700;
      color: #333;
      transition: .2s;
    }

    .nav-link:hover {
      background: #111;
      color: #fff;
    }

       GRID
    ========================= */

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
      gap: 30px;
      align-items: start;
    }

    section,
    .side-card {
      background: #fff;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

      font-size: 26px;
      line-height: 1.2;
      margin-bottom: 15px;
    }

    h3 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    p {

    }

    ========================= */

      display: inline-block;
      margin-top: 5px;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    /* =========================
       CHILDREN GALLERY
    ========================= */

    .children-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .children-gallery img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
    }

      border-bottom: 0;
